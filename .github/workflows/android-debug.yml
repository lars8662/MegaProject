name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android platform files
        run: |
          set -euo pipefail

          # Keep the application code and dependencies from the PR branch.
          mkdir -p /tmp/climbing_diary_keep
          cp pubspec.yaml /tmp/climbing_diary_keep/pubspec.yaml
          cp analysis_options.yaml /tmp/climbing_diary_keep/analysis_options.yaml
          cp -R lib /tmp/climbing_diary_keep/lib
          cp -R test /tmp/climbing_diary_keep/test

          # Generate a fresh Android platform folder with the current Flutter SDK.
          rm -rf android
          flutter create --platforms=android --org com.zalim --project-name climbing_diary --overwrite .

          # Restore the PR app code that flutter create may overwrite.
          cp /tmp/climbing_diary_keep/pubspec.yaml pubspec.yaml
          cp /tmp/climbing_diary_keep/analysis_options.yaml analysis_options.yaml
          rm -rf lib test
          cp -R /tmp/climbing_diary_keep/lib lib
          cp -R /tmp/climbing_diary_keep/test test

          # Use the requested compact application id instead of Flutter's default underscore package.
          find android -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.xml" -o -name "*.kt" \) -print0 \
            | xargs -0 sed -i "s/com.zalim.climbing_diary/com.zalim.climbingdiary/g"

          rm -rf android/app/src/main/kotlin/com/zalim/climbing_diary
          mkdir -p android/app/src/main/kotlin/com/zalim/climbingdiary
          cat > android/app/src/main/kotlin/com/zalim/climbingdiary/MainActivity.kt <<'EOF'
          package com.zalim.climbingdiary

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

      - name: Configure debug APK signing
        run: |
          set -euo pipefail

          if [ -f android/app/build.gradle ]; then
            gradle_file="android/app/build.gradle"
            gradle_syntax="groovy"
          elif [ -f android/app/build.gradle.kts ]; then
            gradle_file="android/app/build.gradle.kts"
            gradle_syntax="kotlin"
          else
            echo "Could not find android/app/build.gradle or android/app/build.gradle.kts after regenerating android/." >&2
            echo "Files found under android/:" >&2
            find android -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          GRADLE_FILE="$gradle_file" GRADLE_SYNTAX="$gradle_syntax" python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["GRADLE_FILE"])
          syntax = os.environ["GRADLE_SYNTAX"]
          text = path.read_text()

          if "$HOME/.android/debug.keystore" in text:
              raise SystemExit(f"{path} should reference the runner home through Gradle, not a literal shell path")

          if syntax == "groovy":
              signing_config = """
              signingConfigs {
                  debug {
                      storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
              debug_build_type = """
                  debug {
                      signingConfig signingConfigs.debug
                  }
          """
              signing_marker = "storeFile file(\"${System.properties['user.home']}/.android/debug.keystore\")"
              debug_marker = "signingConfig signingConfigs.debug"
              build_types_marker = "    buildTypes {"
          elif syntax == "kotlin":
              signing_config = """
              signingConfigs {
                  getByName(\"debug\") {
                      storeFile = file(\"${System.getProperty(\"user.home\")}/.android/debug.keystore\")
                      storePassword = \"android\"
                      keyAlias = \"androiddebugkey\"
                      keyPassword = \"android\"
                  }
              }
          """
              debug_build_type = """
                  getByName(\"debug\") {
                      signingConfig = signingConfigs.getByName(\"debug\")
                  }
          """
              signing_marker = 'storeFile = file("${System.getProperty("user.home")}/.android/debug.keystore")'
              debug_marker = 'getByName("debug") {\n                      signingConfig = signingConfigs.getByName("debug")'
              build_types_marker = "    buildTypes {"
          else:
              raise SystemExit(f"Unsupported Gradle syntax: {syntax}")

          if signing_marker not in text:
              if build_types_marker not in text:
                  raise SystemExit(f"Could not find {build_types_marker!r} in {path}")
              text = text.replace(build_types_marker, signing_config + "\n" + build_types_marker, 1)

          if debug_marker not in text:
              if build_types_marker not in text:
                  raise SystemExit(f"Could not find {build_types_marker!r} in {path}")
              text = text.replace(build_types_marker, build_types_marker + debug_build_type, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore persistent debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          # GitHub-hosted runners create different default debug keystores on each run.
          # Restoring one persistent debug.keystore lets internal/manual APK artifacts
          # install as updates over previous artifacts instead of requiring uninstall first.
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 secret is required to sign debug APK artifacts consistently." >&2
            exit 1
          fi

          # The secret must contain a base64-encoded debug.keystore generated once.
          # This is only for internal/manual APK testing, not final Play Store signing.
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: flutter build apk --debug --build-number ${{ github.run_number }}

      - name: Diagnose APK signing certificate
        run: |
          set -euo pipefail

          apk_path="build/app/outputs/flutter-apk/app-debug.apk"
          keystore_path="$HOME/.android/debug.keystore"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$sdk_root" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT is required to locate apksigner." >&2
            exit 1
          fi

          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Could not find apksigner in Android SDK build-tools." >&2
            exit 1
          fi

          apk_sha256="$("$apksigner" verify --print-certs "$apk_path" \
            | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')"
          keystore_sha256="$(keytool -list -v -keystore "$keystore_path" -storepass android -alias androiddebugkey 2>/dev/null \
            | awk -F': ' '/SHA256:/ {print $2; exit}')"

          if [ -z "$apk_sha256" ]; then
            echo "Could not read APK signer SHA-256 fingerprint." >&2
            exit 1
          fi

          if [ -z "$keystore_sha256" ]; then
            echo "Could not read CI debug keystore SHA-256 fingerprint." >&2
            exit 1
          fi

          echo "APK signer SHA-256: $apk_sha256"
          echo "CI debug keystore SHA-256: $keystore_sha256"

          normalized_apk_sha256="$(printf '%s' "$apk_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          normalized_keystore_sha256="$(printf '%s' "$keystore_sha256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [ "$normalized_apk_sha256" != "$normalized_keystore_sha256" ]; then
            echo "APK signer SHA-256 does not match CI debug keystore SHA-256." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
