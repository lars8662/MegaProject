name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create --platforms=android --org com.zalim --project-name climbing_diary --overwrite .

          if [ -f android/app/build.gradle ]; then
            sed -i "s/com.zalim.climbing_diary/com.zalim.climbingdiary/g" android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i "s/com.zalim.climbing_diary/com.zalim.climbingdiary/g" android/app/build.gradle.kts
          fi

          rm -rf android/app/src/main/kotlin/com/zalim/climbing_diary
          mkdir -p android/app/src/main/kotlin/com/zalim/climbingdiary
          cat > android/app/src/main/kotlin/com/zalim/climbingdiary/MainActivity.kt <<'EOF'
          package com.zalim.climbingdiary

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
